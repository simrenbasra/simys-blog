
<div class="simbot-widget">

  <button id="simbot-toggle" class="simbot-toggle"
          aria-label="Open SimBot" aria-expanded="false">
    💬
    <span>Have a question? Ask SimBot!</span>
  </button>

  <section id="simbot-panel" class="simbot-panel" hidden>
    <div class="simbot-heading">
      <div>
        <strong>💬 Chat with SimBot</strong>
        <small>Your AI assistant</small>
      </div>
      <button id="simbot-close" aria-label="Close chat">×</button>
    </div>

    <iframe
      src="https://simrenbasra-simbot-chatbot.hf.space?__theme=light"
      title="Chat with SimBot"
      allow="clipboard-write; fullscreen">
    </iframe>
  </section>
</div>

<style>
/* Floating message button */
.simbot-widget {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 9999;
  font-family: Arial, sans-serif;
}

.simbot-toggle {
  background: #315D91;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 13px 18px;
  cursor: pointer;
  box-shadow: 0 3px 12px #0003;
  font-size: 14px;
}

/* Vertical chat panel */
.simbot-panel {
  position: fixed;
  top: 20px;
  right: 20px;
  bottom: 20px;
  width: 360px;
  max-width: calc(100vw - 40px);
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 24px #0003;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  z-index: 10000;
}

.simbot-panel[hidden] {
  display: none;
}

.simbot-heading {
  background: #315D91;
  color: white;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.simbot-heading small {
  display: block;
  margin-top: 4px;
}

#simbot-close {
  background: none;
  color: white;
  border: none;
  font-size: 28px;
  cursor: pointer;
}

.simbot-panel iframe {
  width: 100%;
  flex: 1;
  min-height: 0;
  border: none;
}

/* Push article aside on desktop */
body.simbot-open .page-content {
  padding-right: 380px;
  transition: padding-right 0.3s ease;
}

/* On smaller screens, use an overlay instead */
@media (max-width: 800px) {
  body.simbot-open .page-content {
    padding-right: 0;
  }

  .simbot-panel {
    top: 10px;
    right: 10px;
    bottom: 10px;
    width: calc(100vw - 20px);
    max-width: none;
  }
}
</style>

<script>
(function () {
  const toggle = document.getElementById('simbot-toggle');
  const panel = document.getElementById('simbot-panel');
  const close = document.getElementById('simbot-close');

  if (!toggle || !panel || !close) return;

  function openChat() {
    panel.hidden = false;
    document.body.classList.add('simbot-open');
    toggle.setAttribute('aria-expanded', 'true');
  }

  function closeChat() {
    panel.hidden = true;
    document.body.classList.remove('simbot-open');
    toggle.setAttribute('aria-expanded', 'false');
  }

  toggle.addEventListener('click', openChat);
  close.addEventListener('click', closeChat);
})();
</script>
