
<div class="simbot-widget">

  <button id="simbot-toggle"
          class="simbot-toggle"
          aria-label="Got a question?"
          aria-expanded="false">
  
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
    </svg>
  
    <span class="simbot-tooltip">Ask a question</span>
  </button>

  <section id="simbot-panel" class="simbot-panel" hidden>
    <div class="simbot-heading">
      <div>
        <strong>💬 Chat with SimBot</strong>
        <small>Your AI assistant</small>
      </div>
      <button id="simbot-close" aria-label="Close chat">×</button>
    </div>

    <iframe
      id="simbot-iframe"
      src="https://simrenbasra-simbot-chatbot.hf.space?__theme=light"
      title="Chat with SimBot"
      allow="clipboard-write; fullscreen">
    </iframe>
  </section>
</div>

<style>
/* Floating message button */
.simbot-widget {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 9999;
  font-family: Arial, sans-serif;
}

.simbot-toggle {
  position: relative;
  width: 58px;
  height: 58px;
  border: none;
  border-radius: 50%;
  background: #A9567B;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(80, 40, 60, 0.22);
  animation: simbot-bounce 0.8s ease 1s 1;
  transition: transform 0.25s ease, background 0.25s ease;
}

.simbot-toggle:hover {
  background: #914365;
  transform: scale(1.1);
}

.simbot-toggle svg {
  width: 27px;
  height: 27px;
  fill: none;
  stroke: white;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Initial gentle bounce */

@keyframes simbot-bounce {
  0%, 100% { transform: translateY(0); }
  35% { transform: translateY(-9px); }
  65% { transform: translateY(2px); }
}

/* Hover label */

.simbot-tooltip {
  position: absolute;
  right: 70px;
  top: 50%;
  transform: translate(5px, -50%);
  background: #604B57;
  color: white;
  padding: 9px 13px;
  border-radius: 7px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.simbot-toggle:hover .simbot-tooltip {
  opacity: 1;
  visibility: visible;
  transform: translate(0, -50%);
}

/* Keyboard accessibility */

.simbot-toggle:focus-visible {
  outline: 3px solid #DDA9BF;
  outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {
  .simbot-toggle {
    animation: none;
    transition: none;
  }
}

/* Vertical chat panel */
.simbot-panel {
  position: fixed;
  top: 20px;
  right: 20px;
  bottom: 20px;
  width: 360px;
  max-width: calc(100vw - 40px);
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 24px #0003;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  z-index: 10000;
}

.simbot-panel[hidden] {
  display: none;
}

.simbot-heading {
  background: #A9567B;
  color: white;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.simbot-heading small {
  display: block;
  margin-top: 4px;
}

#simbot-close {
  background: none;
  color: white;
  border: none;
  font-size: 28px;
  cursor: pointer;
}

.simbot-panel iframe {
  width: 100%;
  flex: 1;
  min-height: 0;
  border: none;
}

/* Push article aside on desktop */
body.simbot-open .page-content {
  padding-right: 380px;
  transition: padding-right 0.3s ease;
}

/* On smaller screens, use an overlay instead */
@media (max-width: 800px) {
  body.simbot-open .page-content {
    padding-right: 0;
  }

  .simbot-panel {
    top: 10px;
    right: 10px;
    bottom: 10px;
    width: calc(100vw - 20px);
    max-width: none;
  }
}
</style>


<script>
(function () {
  const toggle = document.getElementById('simbot-toggle');
  const panel = document.getElementById('simbot-panel');
  const close = document.getElementById('simbot-close');
  const iframe = document.getElementById('simbot-iframe');

  if (!toggle || !panel || !close || !iframe) {
    console.error('[SimBot] Widget elements not found');
    return;
  }

  const chatbotOrigin = 'https://simrenbasra-simbot-chatbot.hf.space';

  function sendPostContext() {
    const title = document.getElementById('simbot-post-title');
    const url = document.getElementById('simbot-post-url');
    const article = document.getElementById('simbot-post-text');

    if (!title || !url || !article) {
      console.log('[SimBot] No blog post context found');
      return;
    }

    const postTitle = title.textContent.trim();

    const context = `
Article title: ${postTitle}

Article URL: ${url.textContent.trim()}

Article text:
${article.textContent.trim()}
`;

    console.log('[SimBot] Sending article:', postTitle);
    console.log('[SimBot] Article length:', context.length);

    iframe.contentWindow.postMessage(
      {
        type: 'SIMBOT_CONTEXT',
        context: context,
        welcome: {
          heading: "Let's explore this post.",
          description: "Ask me questions about its ideas, key points, or anything you'd like to understand better."
        }
      },
      chatbotOrigin
    );
  }

  // Listen for Gradio announcing that it is ready
  window.addEventListener('message', function (event) {
    if (event.origin !== chatbotOrigin) return;
    if (event.source !== iframe.contentWindow) return;

    if (event.data && event.data.type === 'SIMBOT_READY') {
      console.log('[SimBot] Chatbot is ready');
      sendPostContext();
    }
  });

  function openChat() {
    panel.hidden = false;
    document.body.classList.add('simbot-open');
    toggle.setAttribute('aria-expanded', 'true');

    sendPostContext();
  }

  function closeChat() {
    panel.hidden = true;
    document.body.classList.remove('simbot-open');
    toggle.setAttribute('aria-expanded', 'false');
  }

  toggle.addEventListener('click', openChat);
  close.addEventListener('click', closeChat);

  console.log('[SimBot] Floating widget initialised');

})();
</script>
